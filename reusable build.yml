name: Reusable Build

on:
 workflow_call:
  inputs:
    app_name:
    required: true
    type: string
    environment:
       required:
       type: string
       default: staging

       secrets:
         docker_token:
            required: true

            jobs:
              build:
                runs_on: ubuntu-latest

                steps:
                 - name: Checkout code
                    uses: actions/checkout@v4

                    - name: Build application 
                       run: echo "Building $
         {{inputs.app_name}} for $
         {{inputs.environment}}"
                      - name: Check Docker token
                         run: echo "Docker token is set:
                         ${{ secrets.docker_token !=''}}
         {{
